[build]
  publish = "teamo/frontend"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  # frontend/*.html reference assets as /static/css/..., /static/js/..., /static/img/...
  # (the old Flask convention: @app.route("/static/<path:path>")). Netlify serves
  # teamo/frontend's contents at their direct paths, so strip the prefix instead of
  # touching every HTML file.
  from = "/static/*"
  to = "/:splat"
  status = 200

[[redirects]]
  # "/" and the old shared login page go to the employee login; admins use /admin-login
  from = "/"
  to = "/employee-login"
  status = 302

[[redirects]]
  from = "/login.html"
  to = "/employee-login"
  status = 302

[[redirects]]
  from = "/employee-login"
  to = "/employee-login.html"
  status = 200

[[redirects]]
  from = "/admin-login"
  to = "/admin-login.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/employee"
  to = "/employee.html"
  status = 200

[[redirects]]
  from = "/meet/*"
  to = "/meet.html"
  status = 200
